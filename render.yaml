# Render Blueprint for the booking API (free plan). The landing page goes on Vercel (root directory: web/).
services:
  - type: web
    name: demo-citas-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_CORS_ORIGINS
        sync: false   # set to the Vercel URL of the landing page, e.g. https://demo-citas.buestro.com
