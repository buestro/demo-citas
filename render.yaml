# Render Blueprint for the booking API (free plan). The landing page goes on Vercel (root directory: web/).
services:
  - type: web
    name: demo-citas-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_TRUSTED_PROXIES
        value: "1"    # Render's proxy is in front of the API; confirm on the first deploy (see api/README.md)
      - key: DEMO_SIGNING_KEY
        generateValue: true   # keeps chat conversations valid across restarts
      - key: ANTHROPIC_API_KEY
        sync: false   # paste it in the Render dashboard; never commit it
      - key: DEMO_ADMIN_KEY
        sync: false   # the doctor's view key (16+ characters); paste it in the dashboard, never commit it
      - key: DEMO_CORS_ORIGINS
        sync: false   # set to the Vercel URL of the landing page, e.g. https://demo-citas.buestro.com
